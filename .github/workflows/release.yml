name: Release

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:
    inputs:
      tag:
        description: "Release tag, for example v0.1.0"
        required: true
        type: string

permissions:
  contents: write

env:
  VJ_CURATOR_RELEASE_TAG: ${{ github.event_name == 'workflow_dispatch' && inputs.tag || github.ref_name }}

jobs:
  windows:
    name: Windows portable
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install build dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            automake \
            autopoint \
            bison \
            build-essential \
            flex \
            gettext \
            git \
            libtool \
            lua5.2 \
            mingw-w64 \
            nasm \
            pkg-config \
            protobuf-compiler \
            ragel \
            subversion \
            unzip \
            yasm \
            zip \
            p7zip-full

      - name: Build Windows portable archive
        run: bash scripts/github/build-windows-portable.sh x86_64

      - name: Upload Windows artifact
        uses: actions/upload-artifact@v4
        with:
          name: windows-portable
          path: dist/*

  macos:
    name: macOS portable
    runs-on: macos-14
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install build dependencies
        run: |
          brew update
          brew install autoconf automake libtool pkg-config gettext yasm nasm cmake ninja

      - name: Build macOS portable archive
        run: bash scripts/github/build-macos-portable.sh "$(uname -m)" build-macos

      - name: Upload macOS artifact
        uses: actions/upload-artifact@v4
        with:
          name: macos-portable
          path: dist/*

  release:
    name: Publish GitHub Release
    runs-on: ubuntu-24.04
    needs:
      - windows
      - macos
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Download artifacts
        uses: actions/download-artifact@v4
        with:
          path: dist
          merge-multiple: true

      - name: Resolve tag
        id: tag
        run: |
          echo "tag=${VJ_CURATOR_RELEASE_TAG}" >> "$GITHUB_OUTPUT"

      - name: Create or update release
        env:
          GH_TOKEN: ${{ github.token }}
          TAG_NAME: ${{ steps.tag.outputs.tag }}
        run: |
          if gh release view "$TAG_NAME" >/dev/null 2>&1; then
            gh release edit "$TAG_NAME" \
              --title "VJ Curator $TAG_NAME" \
              --notes-file RELEASE_NOTES.md
            gh release view "$TAG_NAME" --json assets --jq '.assets[].name' |
              while IFS= read -r asset; do
                case "$asset" in
                  vj-curator-*) gh release delete-asset "$TAG_NAME" "$asset" --yes ;;
                esac
              done
            gh release upload "$TAG_NAME" dist/* --clobber
          else
            gh release create "$TAG_NAME" dist/* \
              --title "VJ Curator $TAG_NAME" \
              --notes-file RELEASE_NOTES.md
          fi
